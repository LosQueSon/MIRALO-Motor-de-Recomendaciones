name: Deploy FastAPI to Azure Web App

on:
  push:
    branches:
      - main
      - AI-engine-for-recommendations-and-voting
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: miralo-AI-engine
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Empaquetar artefacto
        run: |
          zip -r release.zip main.py requirements.txt startup.sh \
            --exclude "*.git*" --exclude "__pycache__/*" --exclude "*.pyc"

      - uses: actions/upload-artifact@v4
        with:
          name: fastapi-app
          path: release.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fastapi-app

      - name: Deploy a Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: release.zip

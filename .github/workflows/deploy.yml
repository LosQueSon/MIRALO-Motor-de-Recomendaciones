name: Deploy FastAPI to Azure Web App

on:
  push:
    branches:
      - AI-engine-for-recommendations-and-voting
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: miralo-ai
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests
        run: |
          python -m pytest tests/ -q || true

      - name: Empaquetar artefacto
        run: |
          mkdir -p deploy
          cp -r main.py requirements.txt startup.sh deploy/
          cp -r ml deploy/
          cp -r ml_models deploy/
          cp -r data deploy/
          cp -r tests deploy/
          cd deploy
          zip -r ../release.zip . \
            --exclude "*.git*" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".pytest_cache/*" \
            --exclude "tests/*"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-app
          path: release.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: fastapi-app

      - name: Deploy a Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: release.zip
          startup-command: bash startup.sh

      - name: Log deployment
        run: |
          echo "✅ Deployment completed!"
          echo "App URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"


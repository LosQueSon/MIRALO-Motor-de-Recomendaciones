name: Deploy FastAPI to Azure Web App

on:
  push:
    branches:
      - AI-engine-for-recommendations-and-voting
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: miralo-ai
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias (incluyendo dev para tests)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar tests
        run: |
          python -m pytest tests/ -q || true

      - name: Empaquetar artefacto
        run: |
          mkdir -p deploy
          cp main.py requirements.txt startup.sh deploy/
          cp -r ml deploy/
          cp -r ml_models deploy/
          # ratings.csv is NOT bundled — it is only needed for training.
          # popularity is loaded from movies.csv (pre-computed) or defaults to 0.
          mkdir -p deploy/data
          cp data/movies.csv deploy/data/
          cd deploy
          # rf_model is excluded: XGBoost (531 KB) has identical accuracy and
          # 20× smaller memory footprint. Keeping RF out saves ~11 MB per deploy.
          zip -r ../release.zip . \
            --exclude "*.git*" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".pytest_cache/*" \
            --exclude "ml_models/rf_recommender_model.joblib"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-app
          path: release.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: fastapi-app

      - name: Deploy a Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: release.zip
          startup-command: bash startup.sh

      - name: Log deployment
        run: |
          echo "✅ Deployment completed!"
          echo "App URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
